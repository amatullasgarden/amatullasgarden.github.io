<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174B32"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Amatulla's Garden – একটু বাগান, অনেকটা ভালোবাসা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--f:#174b32;--deep:#103b29;--m:#dff2e6;--p:#f5f8f3;--leaf:#5d9b70;--muted:#718477;--line:#e6eee7;--ink:#183326}*{box-sizing:border-box}
body{margin:0;background:var(--p);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.g{background:#fff;border:1px solid var(--line);border-radius:19px}
aside{position:fixed;inset:0 auto 0 0;width:248px;background:var(--deep);color:#fff;padding:26px 16px;display:flex;flex-direction:column;gap:18px;overflow:auto;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}.bi{width:44px;height:44px;border-radius:15px;background:#e2f3e6;display:grid;place-items:center;font-size:24px}.brand b{font-size:17px;display:block}.brand small{color:#b8d4c1;font-size:11px}
.nav{display:grid;gap:5px}.nl{font-size:11px;letter-spacing:1px;color:#91b39c;padding:10px 12px 2px}
.nv{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:13px;color:#c9ddce;font-size:14px}.nv.on,.nv:hover{background:#ffffff18;color:#fff}.nv span:first-child{width:20px;text-align:center}.S{display:none}
.sb{margin-top:auto;background:#ffffff12;border:1px solid #ffffff20;padding:16px;border-radius:17px;font-size:14px}.sb p{font-size:12px;color:#c2d9c9;line-height:1.6;margin:6px 0 0}
main{margin-left:248px;padding:28px 34px 42px;max-width:1190px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:10px}.eyebrow{color:var(--leaf);font-size:12px;font-weight:600}.topbar h2{font-size:25px;margin:4px 0 0}.ta{display:flex;gap:10px;align-items:center}.ib{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:13px;display:grid;place-items:center;font-size:17px;position:relative}.dot{position:absolute;width:8px;height:8px;background:#e76b52;border-radius:50%;right:9px;top:8px}.pf{display:flex;align-items:center;gap:10px}.av{width:40px;height:40px;border-radius:14px;background:#dceee0;display:grid;place-items:center;font-size:20px}.pf b{font-size:13px;display:block}.pf small{color:var(--muted);font-size:11px}
h2{color:var(--f);margin:0 0 14px;font-size:22px}h3{margin:0 0 10px;color:var(--f);font-size:16px}
.hero{border-radius:24px;padding:25px 28px;min-height:178px;background:linear-gradient(105deg,#174b32 0%,#276c49 58%,#6d9d69 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff22;border-radius:50%;right:100px;top:-120px;box-shadow:0 0 0 35px #ffffff0b,0 0 0 70px #ffffff08}.hc{position:relative;z-index:1;max-width:560px}.tag{font-size:11px;background:#ffffff20;padding:6px 11px;border-radius:20px}.hero h3{font-size:24px;line-height:1.4;margin:14px 0 12px;color:#fff}.hero button{margin-top:16px;background:#f1f8ee;color:var(--deep);font-size:13px}.ha{font-size:96px;z-index:1;padding-right:24px}
.hb{display:flex;height:10px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.2);max-width:420px}.hb i{display:block}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:18px}.st b{font-size:23px;display:block;line-height:1.2}.stat{display:flex;align-items:center;gap:13px}.stat i{font-style:normal;width:43px;height:43px;border-radius:14px;background:#e8f4e9;display:grid;place-items:center;font-size:21px}.stat:nth-child(3) i{background:#fff3dc}.stat:nth-child(4) i{background:#fbece5}.stat small{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:17px;margin-top:18px}
.c{padding:18px}.mu{color:var(--muted);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input,.bar select{flex:1;min-width:150px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cfe0d4;border-radius:12px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--f);box-shadow:0 0 0 3px rgba(23,75,50,.15)}
button{border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:#fff;color:var(--f);font-weight:500;cursor:pointer}button:disabled{opacity:.6}.pr{background:var(--f);color:#fff;border-color:var(--f)}.rd{color:#b42318}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.chips button{border-radius:99px;padding:6px 14px;white-space:nowrap;font-size:14px}.chips .on{background:var(--f);color:#fff}
.pc{overflow:hidden;cursor:pointer;padding:0;text-align:left;display:block;width:100%}.pc .im{height:100px;background:linear-gradient(135deg,#eaf5e9,#d5e9d6);display:grid;place-items:center;font-size:44px}.pc img{width:100%;height:100%;object-fit:cover}.pc div.t{padding:11px}
.bd{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;margin-top:4px}.ok{background:#e6f4e9;color:#39764c}.care{background:#fef3c7;color:#92400e}.sick{background:#fee2e2;color:#991b1b}
.row{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:6px;border-radius:13px;background:#f8faf7;font-size:14px}.row>span:first-child{flex:1}.note{background:#fffbeb;color:#92400e;border-radius:12px;padding:10px 14px;font-size:14px}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--p)}dialog::backdrop{background:rgba(0,0,0,.4)}
.fm{padding:18px;display:grid;gap:10px}.fm label{display:grid;gap:4px;font-size:14px;font-weight:500;color:var(--f)}.fm img{max-height:120px;border-radius:12px;object-fit:cover}.bt{display:flex;gap:8px;justify-content:flex-end}.er{color:#b42318;margin:0;font-size:14px}
.cb{height:10px;background:var(--m);border-radius:9px;overflow:hidden;margin-bottom:8px}.cb i{display:block;height:100%;background:var(--f)}
.mpw{overflow-x:auto;border-radius:19px;-webkit-overflow-scrolling:touch}
.mp{position:relative;aspect-ratio:5/4;min-width:620px;container-type:inline-size;border-radius:19px;overflow:hidden;background:#d9d1c1}
.mp svg.sc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mp .ed{position:absolute;pointer-events:none;font-size:11px;font-weight:600;background:#ffffffd9;color:#174b32;padding:1px 9px;border-radius:99px;z-index:2;white-space:nowrap}
.it{position:absolute;z-index:3;transform:translate(-50%,-50%);touch-action:none;cursor:grab;user-select:none;padding:3px 8px;border-radius:12px;background:#fff;color:#183326;border:2px solid var(--f);font-size:clamp(10px,1.7cqw,13px);display:flex;flex-direction:column;align-items:center;line-height:1.2;text-align:center;box-shadow:0 2px 6px #0003;white-space:nowrap}
.it .ic{font-size:1.45em}
.it.bowl{width:9cqw;height:9cqw;min-width:46px;min-height:46px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#e8e3d7,#b4ae9f);border-color:#857f6e;justify-content:center;padding:0;white-space:normal}.it.bowl .lb{font-size:.82em;max-width:92%}
.it.pot{border-radius:50%;background:#e9bd94;border-color:#b5703b;color:#4a2a12}
.it.row{width:22cqw;min-width:130px;border-radius:7px;background:#b0804f;border-color:#6f4a2b;color:#fff}
.it.sun{background:#fff3b0b0;border-style:dashed;width:24cqw;height:34cqw;justify-content:center;box-shadow:none}.it.shade{background:#455a6499;color:#fff;border-style:dashed;width:24cqw;height:34cqw;justify-content:center;box-shadow:none}
.it.path{background:#e0d6cf;border-color:#a1887f;width:24cqw;height:5cqw;min-height:26px;padding:0;justify-content:center;flex-direction:row}.it.sel{outline:3px solid #f59e0b}
.on-off{position:fixed;top:0;left:248px;right:0;background:#92400e;color:#fff;text-align:center;font-size:13px;padding:3px;z-index:30}
@media(max-width:860px){aside{position:static;width:auto;padding:13px 15px;gap:10px}.sb,.nl{display:none}.nav{display:flex;overflow-x:auto;gap:5px}.nv{white-space:nowrap;padding:9px 12px;font-size:12px;gap:6px}.L{display:none}.S{display:inline}main{margin:0;padding:18px 14px 30px}.topbar h2{font-size:20px}.pf div:last-child{display:none}.hero{padding:20px;min-height:160px}.hero h3{font-size:19px}.ha{font-size:60px;padding:0}.on-off{left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ib{padding:0}
.hero.m{background:linear-gradient(105deg,#174b32 0%,#3b7a4a 55%,#d4b24c 100%)}.hero.n{background:linear-gradient(105deg,#0b2a3a 0%,#124a46 60%,#2a6a5a 100%)}
.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1}.ring>div{width:86px;height:86px;border-radius:50%;background:#174b32;display:grid;place-items:center;text-align:center;line-height:1.1}.ring b{font-size:20px}.ring small{font-size:11px;color:#bfe3c9}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cg em{font-style:normal;text-align:center;font-size:12px;color:var(--muted)}.dy{aspect-ratio:1;padding:2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:500}.dy.td{border:2px solid var(--f)}.dy.sl{background:var(--m)}.dy u{text-decoration:none;font-size:10px;background:#f59e0b;color:#fff;border-radius:99px;padding:0 6px}.dy s{text-decoration:none;font-size:10px;color:#059669}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--f);color:#fff;font-size:28px;padding:0;box-shadow:0 8px 20px rgba(23,75,50,.35);z-index:25;border:0}
.lf{position:fixed;left:50%;top:60%;font-size:40px;z-index:99;pointer-events:none;animation:up 1.1s ease-out forwards}@keyframes up{to{transform:translate(60px,-220px) rotate(40deg);opacity:0}}
body.dk{--p:#0f1a14;--ink:#e3efe6;--line:#244034;--m:#1d3a2b;--muted:#8fb09c;--f:#7fd4a0}body.dk .g,body.dk .ib,body.dk input,body.dk select,body.dk textarea,body.dk button{background:#16251d;color:var(--ink)}body.dk .row{background:#1b2d23}body.dk .pr,body.dk .fab,body.dk .chips .on{background:#2f8f5b;color:#fff;border-color:#2f8f5b}body.dk .hero button{background:#f1f8ee;color:#103b29}body.dk .pc .im{background:#1d3a2b}body.dk .note{background:#3a2f12;color:#f3d98a}body.dk .ok{background:#17402b;color:#9be3b7}
@media(max-width:860px){.ring{width:92px;height:92px}.ring>div{width:66px;height:66px}}
.dy{aspect-ratio:auto;min-height:58px;font-family:'Hind Siliguri',system-ui,sans-serif;font-size:19px;font-weight:600;line-height:1.6;letter-spacing:0}.dy span{display:block}.dy u,.dy s{font-size:12px;line-height:1.5}.cg em{font-size:13px;font-weight:600;padding:4px 0}body.dk .dy{color:#fff}body.dk .dy.td{border-color:#7fd4a0}@media(max-width:860px){.dy{min-height:48px;font-size:16px}.cg{gap:3px}}

 <div class="cards"><div class="g c"><h3>খরচ <button class="pr" onclick="editExp()">+ যোগ</button></h3>${Object.entries(by).map(([k,v])=>`<div class="mu">${EC[k]} – ${money(v)}</div><div class="cb"><i style="width:${v/mx*100}%"></i></div>`).join('')}${D.exp.slice(0,15).map(x=>`<div class="row"><span>${fd(x.date)} · ${EC[x.cat]}${x.note?' · '+esc(x.note):''}</span><b>${money(x.amt)}</b><button class="rd" onclick="if(confirm('মুছবেন?')){D.exp=D.exp.filter(e=>e.id!='${x.id}');save();R()}">✕</button></div>`).join('')||'<p class="mu">কোনো খরচ নেই।</p>'}</div>
 <div class="g c"><h3>ফলন <button class="pr" onclick="editHar()">+ যোগ</button></h3><p class="mu">এই মাস: ${bn(sum(D.har,m,'count'))}টি, ${bn(sum(D.har,m,'kg'))} কেজি · এই বছর: ${bn(sum(D.har,y,'count'))}টি, ${bn(sum(D.har,y,'kg'))} কেজি</p>${D.har.slice(0,15).map(x=>`<div class="row"><span>${fd(x.date)} · ${esc(x.fruit)} (${esc(pn(x.plant))})<br><span class="mu">${bn(x.count||0)}টি · ${bn(x.kg||0)} কেজি</span></span><button class="rd" onclick="if(confirm('মুছবেন?')){D.har=D.har.filter(e=>e.id!='${x.id}');save();R()}">✕</button></div>`).join('')||'<p class="mu">কোনো ফলন নেই।</p>'}</div></div>`},
wx(){wxGet().then(j=>{const e=$('#wxc');if(e)e.innerHTML=wxBox(j,1)});return`<h2>আবহাওয়া – ${esc(D.set.place)}</h2><div class="bar"><button onclick="geo()">📍 আমার অবস্থান ব্যবহার করুন</button></div><div class="g c" id="wxc">লোড হচ্ছে… (ইন্টারনেট লাগবে)</div>`},
map(){if(!D.map.length&&!D.set.ms){D.map=mapPreset();D.set.ms=1;save()}
const Zt=['sun','shade','path'],L=[...D.map].sort((a,b)=>Zt.includes(b.t)-Zt.includes(a.t));
return`<h2>বাগানের মানচিত্র</h2><div class="bar"><button onclick="addMap('plant')">+ গাছ</button><button onclick="addMap('bowl')">+ বড় টব</button><button onclick="addMap('pot')">+ ছোট টব</button><button onclick="addMap('row')">+ টবের সারি</button><button onclick="addMap('sun')">+ রোদ</button><button onclick="addMap('shade')">+ ছায়া</button><button onclick="addMap('path')">+ পথ</button><button onclick="applyPreset()">📷 ছবির মতো সাজান</button>${sel?`<button onclick="renameMap()">✏️ নাম বদলান</button><button class="rd" onclick="D.map=D.map.filter(m=>m.id!=sel);sel=null;save();R()">নির্বাচিতটি মুছুন</button>`:''}</div><div class="mpw g"><div class="mp" id="mp">${mapScene()}<span class="ed" style="top:11px;left:50%;transform:translateX(-50%)">উত্তর ↑</span><span class="ed" style="bottom:7px;left:50%;transform:translateX(-50%)">দক্ষিণ ↓</span><span class="ed" style="left:8px;top:50%;transform:translateY(-50%);background:#174b32d9;color:#fff">← পশ্চিম · গাছের সারি</span><span class="ed" style="right:6px;top:calc(50% + 30px);transform:translateY(-50%)">পূর্ব → ছবির স্থান</span>${L.map(m=>`<div class="it ${m.t}${sel==m.id?' sel':''}" id="i${m.id}" style="left:${m.x}%;top:${m.y}%" onpointerdown="drag(event,'${m.id}')"><span class="ic">${MI[m.t]||''}</span><span class="lb">${esc(m.l)}</span></div>`).join('')}</div></div><p class="mu">📷 ছবি পূর্ব দিক থেকে পশ্চিমমুখী তোলা: ছবির বাঁ দিক = দক্ষিণ, ডান দিক = উত্তর, পেছনের গাছের সারি = পশ্চিম। আইটেম টেনে সরান (নিজে নিজে সংরক্ষিত হয়); নাম বদলাতে আইটেম ছুঁয়ে “✏️ নাম বদলান” চাপুন।</p>`},
notif(){const n=notifs(),g='Notification'in window;return`<h2>নোটিফিকেশন</h2>${g&&Notification.permission!='granted'?'<p><button class="pr" onclick="Notification.requestPermission().then(()=>R())">ব্রাউজার নোটিফিকেশন চালু করুন</button></p>':''}<div class="g c">${n.map(x=>`<div class="row">${x[0]} <span>${esc(x[1])}</span></div>`).join('')||'<p class="mu">কোনো নোটিফিকেশন নেই।</p>'}</div><p class="mu">অনুস্মারক অ্যাপ খোলা থাকলে বা খোলার সময় দেখানো হয়। বন্ধ অবস্থায় পুশ নোটিফিকেশনের জন্য সার্ভার লাগবে।</p>`},
rep(){const y=today().slice(0,4),mo={};D.exp.forEach(x=>{const k=x.date.slice(0,7);mo[k]=(mo[k]||0)+x.amt});const mh={};D.har.forEach(x=>{const k=x.date.slice(0,7);mh[k]=(mh[k]||0)+(+x.kg||0)});const mx=Math.max(1,...Object.values(mo));
 return`<h2>রিপোর্ট</h2><div class="st"><div class="g c"><b>${bn(D.plants.length)}</b>মোট গাছ</div><div class="g c"><b>${bn(stat('ok'))}</b>সুস্থ</div><div class="g c"><b>${bn(stat('care')+stat('sick'))}</b>নজর দরকার</div></div>
 <div class="cards"><div class="g c"><h3>মাসিক খরচ</h3>${Object.keys(mo).sort().map(k=>`<div class="mu">${bn(k)} – ${money(mo[k])}</div><div class="cb"><i style="width:${mo[k]/mx*100}%"></i></div>`).join('')||'<p class="mu">তথ্য নেই।</p>'}<p class="mu">বার্ষিক (${bn(y)}): ${money(sum(D.exp,y,'amt'))}</p></div>
 <div class="g c"><h3>মাসিক ফলন (কেজি)</h3>${Object.keys(mh).sort().map(k=>`<div class="row">${bn(k)} <b>${bn(mh[k])}</b></div>`).join('')||'<p class="mu">তথ্য নেই।</p>'}<h3>সার প্রয়োগ</h3><p>${bn(D.tasks.filter(t=>t.type=='fert'&&t.done).length)}বার সম্পন্ন</p></div>
 <div class="g c"><h3>CSV ডাউনলোড</h3><div class="bar"><button onclick="csv('plants',[['নাম','ধরন','জাত','লাগানো','অবস্থা'],...D.plants.map(p=>[p.name,CAT[p.cat],p.variety,p.planted,ST[p.status]])])">গাছ</button><button onclick="csv('expenses',[['তারিখ','ধরন','টাকা','নোট'],...D.exp.map(x=>[x.date,EC[x.cat],x.amt,x.note])])">খরচ</button><button onclick="csv('harvest',[['তারিখ','ফল','গাছ','সংখ্যা','কেজি'],...D.har.map(x=>[x.date,x.fruit,pn(x.plant),x.count,x.kg])])">ফলন</button></div><p class="mu">PDF-এর জন্য ব্রাউজারের প্রিন্ট → “PDF হিসেবে সংরক্ষণ” ব্যবহার করুন।</p></div></div>`},
set(){return`<h2>সেটিংস</h2><div class="cards"><div class="g c"><h3>আবহাওয়ার অবস্থান</h3><div class="fm" style="padding:0"><label>জায়গার নাম<input id="sp" value="${esc(D.set.place)}" maxlength="40"></label><label>অক্ষাংশ<input id="sa" type="number" step="any" value="${D.set.lat}"></label><label>দ্রাঘিমাংশ<input id="so" type="number" step="any" value="${D.set.lon}"></label><div class="bt"><button onclick="geo()">📍 বর্তমান অবস্থান</button><button class="pr" onclick="const a=+$('#sa').value,o=+$('#so').value;if(a<-90||a>90||o<-180||o>180)return alert('অক্ষাংশ/দ্রাঘিমাংশ সঠিক নয়');D.set={place:$('#sp').value||'আমার বাগান',lat:a,lon:o};save();alert('সংরক্ষিত')">সংরক্ষণ</button></div></div></div>
 ${cloudCard()}<div class="g c"><h3>অ্যাপ ও ব্যাকআপ</h3><div class="bar">${window.IP?'<button class="pr" onclick="IP.prompt()">📲 ইনস্টল করুন</button>':''}<button onclick="const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='amatulla-garden-backup.json';a.click()">ব্যাকআপ নামান</button><label class="pr" style="padding:10px 16px;border-radius:12px;cursor:pointer">ব্যাকআপ ফেরান<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div><p class="mu">ব্যাকআপ নিয়মিত নিন। লগইন করা থাকলে তথ্য আপনার Google অ্যাকাউন্টের ক্লাউডেও সংরক্ষিত থাকে।</p></div></div>`}};
function restore(f){if(!f||!confirm('বর্তমান সব তথ্য ব্যাকআপ দিয়ে বদলে যাবে। এগোবেন?'))return;f.text().then(t=>{try{const j=JSON.parse(t);if(!['plants','tasks','exp','har','map'].every(k=>Array.isArray(j[k]))||!j.set)throw 0;D=j;save();R()}catch(e){alert('ব্যাকআপ ফাইলটি সঠিক নয়।')}})}
function R(keep){const r=location.hash.slice(1)||'dash';const hr=new Date().getHours(),gr=hr<5?'শুভ রাত্রি':hr<12?'শুভ সকাল':hr<16?'শুভ দুপুর':hr<19?'শুভ বিকেল':'শুভ সন্ধ্যা',top=`<header class="topbar"><div><div class="eyebrow">${new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h2>${gr}! আপনার বাগানে স্বাগতম 🌿</h2></div><div class="ta"><button class="ib" onclick="dark()" aria-label="ডার্ক মোড বদলান">${document.body.classList.contains('dk')?'☀️':'🌙'}</button><a class="ib" href="#notif" aria-label="নোটিফিকেশন">🔔${notifs().length?'<i class="dot"></i>':''}</a><div class="pf"><div class="av kid" role="img" aria-label="Amatulla"></div><div><b>আমার বাগান</b><small>বাগান পরিচালনাকারী</small></div></div></div></header>`;$('#nav').innerHTML=NAV.map(([i,e,l,s],n)=>(n==0?'<div class="nl">মূল মেনু</div>':n==7?'<div class="nl">অন্যান্য</div>':'')+`<a class="nv${i==r?' on':''}" href="#${i}"><span>${e}</span><span class="L">${l}</span><span class="S">${s}</span></a>`).join('');$('#app').innerHTML=top+(P[r]||P.dash)();if(keep){const i=$('#q');i.focus();i.setSelectionRange(99,99)}}
addEventListener('hashchange',()=>{scrollTo(0,0);R()});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.IP=e});
const on=()=>$('#off').hidden=navigator.onLine;addEventListener('online',on);addEventListener('offline',on);on();
if(localStorage.getItem('ag.dk')=='1')document.body.classList.add('dk');
R();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if('Notification'in window&&Notification.permission=='granted'&&localStorage.getItem('ag.nd')!=today()){const n=notifs();if(n.length){new Notification("Amatulla's Garden",{body:n.slice(0,3).map(x=>x[1]).join('\n')});localStorage.setItem('ag.nd',today())}}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,collection,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyC6pK4GLHS-kTrUcR6O4ZxUauUDp2QgGQE",authDomain:"garden-4efd3.firebaseapp.com",projectId:"garden-4efd3",storageBucket:"garden-4efd3.firebasestorage.app",messagingSenderId:"41566234510",appId:"1:41566234510:web:0d9671c8cd972c5751e6df"}),auth=getAuth(app),db=getFirestore(app);
const ERR={'permission-denied':'অনুমতি নেই: Firestore Rules (firestore.rules) পাবলিশ করুন।','auth/unauthorized-domain':'Firebase → Authentication → Settings → Authorized domains-এ এই সাইটের ডোমেইন যোগ করুন।','unavailable':'নেটওয়ার্ক সমস্যা, পরে আবার চেষ্টা করুন।','auth/operation-not-allowed':'Firebase → Authentication → Sign-in method-এ Google চালু করুন।','failed-precondition':'Firestore Database তৈরি করা হয়নি।'};
const C=window.CLOUD={user:null,state:'out',msg:'',at:'',push:schedule,signIn,out:()=>signOut(auth),sync:()=>run(pull)};
let timer=null,last={},busy=false,dirty=false;
const em=e=>ERR[e.code]||ERR[(e.code||'').replace('firestore/','')]||e.code||e.message||'অজানা সমস্যা';
const idle=()=>!document.querySelector('dialog[open]');
function ui(){if(location.hash=='#set'&&idle())R()}
function fresh(){R()}
const lmt=()=>+localStorage.getItem('ag.mt')||0;
function schedule(){if(!C.user)return;clearTimeout(timer);timer=setTimeout(()=>{timer=null;run(pushNow)},1500)}
async function run(f){if(!C.user)return;if(busy){dirty=true;return}busy=true;dirty=false;C.state='sync';ui();
 try{await f();C.state='ok';C.at=new Date().toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'});C.msg=''}catch(e){C.state='err';C.msg=em(e)}
 busy=false;ui();if(dirty)schedule()}
async function pushNow(){
 if(!navigator.onLine){dirty=true;return}
 const u=C.user.uid,{plants,...core}=D,ops=[],cur={};
 ops.push(['s',doc(db,'users',u,'ag','core'),JSON.parse(JSON.stringify({...core,ts:lmt()||Date.now()}))]);
 for(const p of plants){const j=JSON.stringify(p);cur[p.id]=j;if(last[p.id]!==j)ops.push(['s',doc(db,'users',u,'plants',p.id),JSON.parse(j)])}
 for(const id in last)if(!(id in cur))ops.push(['d',doc(db,'users',u,'plants',id)]);
 for(let i=0;i<ops.length;i+=400){const b=writeBatch(db);ops.slice(i,i+400).forEach(o=>o[0]=='s'?b.set(o[1],o[2]):b.delete(o[1]));await b.commit()}
 last=cur}
async function pull(){
 if(!navigator.onLine)throw{code:'unavailable'};
 const u=C.user.uid,cs=await getDoc(doc(db,'users',u,'ag','core')),ps=await getDocs(collection(db,'users',u,'plants')),cp=ps.docs.map(d=>d.data());
 last={};cp.forEach(p=>last[p.id]=JSON.stringify(p));
 if(!cs.exists()){if(!lmt())localStorage.setItem('ag.mt',Date.now());return pushNow()}
 const {ts=0,...core}=cs.data();
 if(ts>lmt()){
  for(const k of['tasks','exp','har','map'])if(!Array.isArray(core[k]))core[k]=[];
  if(!core.set)core.set=D.set;
  cp.sort((a,b)=>(b.ts||0)-(a.ts||0));
  setD({...core,plants:cp});localStorage.setItem('ag.mt',ts);
  setTimeout(()=>{if(idle())fresh()},0)
 }else if(lmt()>ts)return pushNow()}
async function signIn(){const p=new GoogleAuthProvider();
 try{await signInWithPopup(auth,p)}catch(e){
  if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code))return signInWithRedirect(auth,p);
  if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)){C.state='err';C.msg=em(e);ui()}}}
onAuthStateChanged(auth,u=>{C.user=u;if(u){run(pull)}else{C.state='out';last={};ui()}});
addEventListener('online',schedule);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&C.user&&!busy&&!timer)run(pull)});
ui();
</script>
